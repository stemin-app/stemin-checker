name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit, so a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint for wasm
        run: |
          cargo clippy -p stemin-compile --no-default-features --features compile --target wasm32-unknown-unknown --locked -- -D warnings
          cargo clippy -p stemin-format --no-default-features --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
